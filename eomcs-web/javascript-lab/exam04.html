<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<h1>데이터 타입</h1>
<p>데이터의 유형. 유형에 따라 사용할 수 있는 연산자가 다르다.</p>
<script>
    console.log(typeof "문자열");
    console.log(typeof '문자열');
    console.log(typeof `문자열`);
    console.log(typeof 100);
    console.log(typeof 3.14);
    console.log(typeof 0xff);
    console.log(typeof 0b11111010);
    console.log(typeof true);
    console.log(typeof false);
    console.log(typeof [10, 20, true, "haha"]);
    console.log(typeof {kor:100,eng:90,working:false,name:'홍길동'});
    console.log(typeof null);
    console.log(typeof function() {console.log('Hello!');});
</script>
</body>
</html>
