<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<h1>배열과 반복문</h1>
<p>반복문을 이용하여 배열을 다룬다.</p>

<script>
"use strict"

const arr = ['홍길동', false, 100, 90, 80];

for (let i = 0; i < arr.length; i++) {
    console.log(arr[i]);
}
console.log('---------------------------');

for (const i in arr) {
    console.log(arr[i]);
}
console.log('---------------------------');

for (const v of arr) {
    console.log(v);
}

</script>
</body>
</html>
