<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<h1>변수</h1>
<p>데이터를 저장하는 메모리를 가리킨다.</p>
<script>
    "use strict"
   
    {
        const v1 = "Hello";
        let v2 = 100;
        var v3 = 100;

        // v1 = "Hello2"; // 오류
        v2 = 200;
        v3 = 300;
    }

    // console.log(v1); // 생성된 블록을 벗어나면 소멸
    // console.log(v2); // 생성된 블록을 벗어나면 소멸
    console.log(v3);

    let sum = 0;
    for (let i = 1; i <= 10; i++) {
        sum = sum + i;
    }
    console.log(sum);

    // dynamic type binding
    let v4 = "Hello";
    console.log(typeof v4);

    v4 = 100;
    console.log(typeof v4);

    v4 = true;
    console.log(typeof v4);

    v4 = [100, 200, true];
    console.log(typeof v4);

    const x1 = 100;
    // const x1 = 200; // 중복 선언 오류

    let x2 = 100;
    // let x2 = 100; // 중복 선언 오류

    var x3 = 100;
    var x3 = 100; // 중복 선언 허용

    console.log(window.x1); // undefined
    console.log(window.x2); // undefined
    console.log(window.x3); // 100
    // var 로 변수를 선언하면 window 객체에 생성된다.
    // 즉 어디에서나 접근할 수 있는 글로벌 변수가 된다.
    // 단 함수 안에서 선언할 때는 함수 안에서만 사용 가능.

</script>
</body>
</html>
