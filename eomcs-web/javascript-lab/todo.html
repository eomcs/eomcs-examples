<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <header id="page-header">
        <h1>할 일 목록</h1>
        <p>할 일을 관리하세요.</p>
    </header>
    
    <main>
        <section>
            <form id="todo-form">
                <label>할 일</label>
                <input id="todo-title" type="text">
                <button id="add-btn" type="button">추가</button>
            </form>
        </section>

        <hr>
        
        <button id="working-tab" type="button" class="tab-btn">진행중</button>
        <button id="completed-tab" type="button" class="tab-btn">완료</button>
        
        <div id="todo-list">
            <section id="working-list">
                <h2>진행 중(<span id="working-length">0</span>)</h2>
            </section>

            <section id="completed-list">
                <h2>완료(<span id="completed-length">0</span>)</h2>
            </section>
        </div>
    </main>
    
    <footer id="page-footer">
        <p>&copy;2026 DS에듀센터</p>
    </footer>

    <script src="todo.js"></script>
</body>
</html>
