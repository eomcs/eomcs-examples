<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<h1>리터럴(literal)</h1>
<p>값을 표현한 것</p>
<script>
    console.log("문자열");
    console.log('문자열');
    console.log(`문자열`);
    console.log(100);
    console.log(3.14);
    console.log(0xff);
    console.log(0b11111010);
    console.log(true);
    console.log(false);
    console.log([10, 20, true, "haha"]);
    console.log({kor:100,eng:90,working:false,name:'홍길동'});
    console.log(null);
    console.log(function() {console.log('Hello!');});
</script>
</body>
</html>
